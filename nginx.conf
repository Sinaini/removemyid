server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml application/wasm;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # OCR worker/core and language packs. Missing files must 404 rather than
    # fall back to index.html, or the service worker would cache HTML as WASM.
    # The .traineddata.gz files are served as-is; tesseract.js gunzips them itself.
    location ~ ^/(tesseract|tessdata)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # The service worker and its registration must always be revalidated so
    # new deploys are picked up (registerType: 'autoUpdate').
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes are served index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
